[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crate-digger"
version = "0.0.1"
description = "AI music search, bridges and listening guides on open data"
requires-python = ">=3.11"
# Runtime deps stay minimal on purpose. Each phase adds only what it needs:
#   Phase 1: pyarrow, psycopg   Phase 2: fastapi, uvicorn   Phase 3: numpy, scipy ...
dependencies = ["lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "lxml-stubs>=0.5"]

[tool.setuptools]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, UP: modern syntax, B: likely bugs
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
